<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg-300-300" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow-300">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-300" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="circle-300" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg-300-300)"/>
  <rect width="300" height="300" fill="url(#grid-300)"/>
  <rect width="300" height="300" fill="url(#circle-300)"/>
  <circle cx="240" cy="60" r="45" fill="#a78bfa" opacity="0.1"/>
  <circle cx="45" cy="240" r="30" fill="#a78bfa" opacity="0.08"/>
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="60" font-weight="800" fill="#ffffff" opacity="0.95" filter="url(#glow-300)">AK</text>
  <text x="50%" y="62%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="25" fill="rgba(255,255,255,0.7)" font-weight="400">Digital Marketing Agency</text>
</svg>