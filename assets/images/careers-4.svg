<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-600-400" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-600">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-600" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="circle-600" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-600-400)"/>
  <rect width="600" height="400" fill="url(#grid-600)"/>
  <rect width="600" height="400" fill="url(#circle-600)"/>
  <circle cx="480" cy="80" r="60" fill="#fbbf24" opacity="0.1"/>
  <circle cx="90" cy="320" r="40" fill="#fbbf24" opacity="0.08"/>
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="80" font-weight="800" fill="#ffffff" opacity="0.95" filter="url(#glow-600)">Innovation</text>
  <text x="50%" y="62%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="33.333333333333336" fill="rgba(255,255,255,0.7)" font-weight="400">Digital Marketing Agency</text>
</svg>